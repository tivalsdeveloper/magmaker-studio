<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MagMaker Studio</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef2f6;color:#1f2937}button,input,select{font:inherit}.app{display:flex;min-height:100dvh}.side{width:270px;flex:0 0 270px;background:#172536;color:#fff;padding:18px;overflow:auto}.brand{font-size:22px;font-weight:800;margin-bottom:20px}.brand small{display:block;font-size:11px;color:#9fb0c2;margin-top:4px}.sec{margin:20px 0}.sec h3{font-size:11px;letter-spacing:1.2px;color:#9fb0c2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool,.tpl{border:0;border-radius:8px;padding:11px;background:#26394d;color:#fff;cursor:pointer}.tool{width:100%;margin:4px 0;text-align:left}.colors{display:flex;gap:10px;flex-wrap:wrap}.color{width:32px;height:32px;border:2px solid #fff;border-radius:50%;cursor:pointer}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{min-height:64px;background:#fff;border-bottom:1px solid #dce2e8;display:flex;align-items:center;padding:10px 18px;gap:10px;position:sticky;top:0;z-index:8}.title{font-size:18px;font-weight:700;border:1px solid #e2e8f0;border-radius:7px;padding:8px;flex:1;min-width:120px}.btn{border:0;border-radius:8px;padding:10px 13px;background:#2384d8;color:#fff;cursor:pointer;font-weight:700;min-height:42px}.btn.gray{background:#64748b}.canvas{flex:1;overflow:auto;padding:35px;display:flex;flex-direction:column;align-items:center;gap:38px}.page{width:794px;min-height:1123px;background:#fff;box-shadow:0 5px 24px #0002;position:relative;padding:55px;outline:0 solid #2384d8;overflow:hidden}.page.active{outline-width:4px}.num{position:absolute;top:8px;right:10px;background:#2384d8;color:#fff;padding:4px 9px;border-radius:5px;font-size:11px}.mast{font-size:52px;font-weight:900;line-height:1;text-transform:uppercase}.kicker{margin:10px 0 28px;border-top:3px solid var(--accent,#2384d8);padding-top:10px;color:#64748b}.hero{height:360px;background:#e5e7eb;border:2px dashed #aab2bd;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;margin:20px 0;text-align:center}.hero img,.photo img{width:100%;height:100%;object-fit:cover}.headline{font-size:38px;font-weight:800;line-height:1.1;margin:22px 0}.text{font-size:17px;line-height:1.75}.two{display:grid;grid-template-columns:2fr 1fr;gap:28px}.card{background:#f4f6f8;padding:20px;border-left:5px solid var(--accent,#2384d8)}[contenteditable=true]:focus{outline:2px solid #2384d8;background:#eef8ff}.block{position:relative;margin:18px 0;padding-top:38px}.controls{position:absolute;top:0;right:0;display:flex;gap:5px}.controls button{border:0;padding:7px 9px;border-radius:5px;cursor:pointer;min-height:32px}.photo{min-height:220px;background:#e5e7eb;border:2px dashed #aab2bd;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;text-align:center}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gallery .photo{min-height:180px}.quote{font-size:28px;font-style:italic;border-left:5px solid var(--accent,#2384d8);padding:20px}.divider{height:4px;background:var(--accent,#2384d8);margin:20px 0}.status{font-size:12px;color:#64748b;white-space:nowrap}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:center;justify-content:center;padding:16px}.modalbox{width:min(100%,480px);max-height:90dvh;overflow:auto;background:#fff;border-radius:12px;padding:22px}.modalbox input,.modalbox select{width:100%;padding:12px;margin:8px 0}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.shade{display:none}.mobile-label{display:none}@media(max-width:900px){.side{position:fixed;z-index:25;left:-290px;top:0;bottom:0;width:285px;transition:left .2s ease;box-shadow:8px 0 24px #0003}.side.open{left:0}.side.open~.shade{display:block;position:fixed;inset:0;background:#0007;z-index:20}.top{padding:8px;gap:7px}.canvas{padding:18px 10px;align-items:stretch}.page{width:100%;max-width:794px;min-height:auto;aspect-ratio:210/297;padding:6.5%;margin:auto}.mast{font-size:clamp(28px,7vw,52px)}.headline{font-size:clamp(24px,5.5vw,38px)}.text{font-size:clamp(14px,3.2vw,17px)}.hero{height:auto;aspect-ratio:16/9}.two{gap:16px}.gallery .photo{min-height:120px}}@media(max-width:600px){.top{flex-wrap:wrap}.top .menu{order:1}.title{order:2;flex:1;width:calc(100% - 58px)}.status{order:3;width:100%;padding-left:4px}.top .actions{order:4;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.top .actions .btn{width:100%;padding:9px 5px}.canvas{padding:12px 6px;gap:22px}.page{padding:7%;box-shadow:0 2px 10px #0002}.mast{font-size:clamp(24px,8vw,36px);overflow-wrap:anywhere}.kicker{font-size:11px;margin-bottom:14px}.headline{font-size:clamp(20px,6.5vw,29px);margin:14px 0}.two{grid-template-columns:1fr}.card{padding:12px}.text{line-height:1.55}.hero{margin:12px 0}.block{margin:12px 0;padding-top:40px}.controls{left:0;right:auto}.controls button{min-width:42px;min-height:36px}.gallery{grid-template-columns:1fr!important}.gallery .photo,.photo{min-height:150px}.quote{font-size:20px;padding:14px}.grid{grid-template-columns:1fr 1fr}.tool,.tpl{min-height:44px}.color{width:38px;height:38px}.row{display:grid;grid-template-columns:1fr 1fr}.row .btn{width:100%}}@media(max-width:380px){.side{width:88vw}.page{padding:6%}.mast{font-size:22px}.headline{font-size:20px}.btn{font-size:13px}.title{font-size:15px}}@media print{.side,.top,.controls,.num,.shade{display:none!important}.app,.main,.canvas{display:block;height:auto;padding:0;background:#fff}.page{box-shadow:none;outline:0!important;width:210mm;min-height:297mm;aspect-ratio:auto;page-break-after:always;margin:0;padding:15mm}}</style></head><body><div class="app"><aside class="side" id="side"><div class="brand">MagMaker Studio<small>Powered by tivalsdeveloper</small></div><div class="sec"><h3>PAGES</h3><button class="tool" onclick="addPage()">＋ Add page</button><button class="tool" onclick="duplicatePage()">⧉ Duplicate page</button><button class="tool" onclick="deletePage()">⌫ Delete page</button></div><div class="sec"><h3>TEMPLATES</h3><div class="grid"><button class="tpl" onclick="template(1)">Modern</button><button class="tpl" onclick="template(2)">Classic</button><button class="tpl" onclick="template(3)">Dark</button><button class="tpl" onclick="template(4)">Minimal</button><button class="tpl" onclick="template(5)">Cover</button><button class="tpl" onclick="template(6)">News</button><button class="tpl" onclick="template(7)">Business</button><button class="tpl" onclick="template(8)">Photo Story</button></div></div><div class="sec"><h3>ADD CONTENT</h3><button class="tool" onclick="addImage()">＋ Image</button><button class="tool" onclick="openGallery()">▦ Image gallery</button><button class="tool" onclick="addText('p')">Aa Text</button><button class="tool" onclick="addText('h')">H Heading</button><button class="tool" onclick="addQuote()">❝ Quote</button><button class="tool" onclick="addDivider()">━ Divider</button></div><div class="sec"><h3>THEME</h3><div class="colors"><i class="color" style="background:#2384d8" onclick="color('#2384d8')"></i><i class="color" style="background:#e11d48" onclick="color('#e11d48')"></i><i class="color" style="background:#16a34a" onclick="color('#16a34a')"></i><i class="color" style="background:#7c3aed" onclick="color('#7c3aed')"></i><i class="color" style="background:#f59e0b" onclick="color('#f59e0b')"></i><i class="color" style="background:#111827" onclick="color('#111827')"></i></div></div></aside><div class="shade" id="shade" onclick="side.classList.remove('open')"></div><main class="main"><header class="top"><button class="btn gray menu" onclick="side.classList.toggle('open')">☰</button><input id="magTitle" class="title" value="My Magazine"><span class="status" id="status">Saved locally</span><div class="actions"><button class="btn gray" onclick="newProject()">New</button><button class="btn" onclick="save()">Save</button><button class="btn" onclick="window.print()">PDF</button></div></header><section class="canvas" id="pages"></section></main></div><div class="modal" id="galleryModal"><div class="modalbox"><h2>Add image gallery</h2><p>Select several images at once.</p><input type="file" id="galleryFiles" accept="image/*" multiple><select id="galleryCols"><option value="2">2 columns</option><option value="3">3 columns</option><option value="4">4 columns</option></select><div class="row"><button class="btn gray" onclick="galleryModal.style.display='none'">Cancel</button><button class="btn" onclick="insertGallery()">Insert gallery</button></div></div></div><input type="file" id="imagePicker" accept="image/*" hidden><script>const pages=document.getElementById('pages'),magTitle=document.getElementById('magTitle'),side=document.getElementById('side'),galleryModal=document.getElementById('galleryModal'),imagePicker=document.getElementById('imagePicker');let active=null,imageTarget=null,accent='#2384d8',timer;function base(t=1){let style=t===3?'background:#111827;color:white;':'';return `<div class="page" style="--accent:${accent};${style}"><div class="num"></div><div class="mast" contenteditable="true">${magTitle.value||'MY MAGAZINE'}</div><div class="kicker" contenteditable="true">ISSUE 01 • STORIES • IDEAS • PEOPLE</div><div class="hero" onclick="pick(this)">Tap to add a cover image</div><div class="headline" contenteditable="true">A powerful story starts with a great headline</div><div class="two"><div class="text" contenteditable="true">Tap here and start writing your article. MagMaker works on desktop, tablet and mobile devices.</div><div class="card"><h2 contenteditable="true">Inside</h2><p contenteditable="true">Add highlights, notes or important information here.</p></div></div></div>`}function bind(p){p.onclick=e=>{setActive(p)}}function setActive(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));active=p;p.classList.add('active');number()}function number(){[...pages.children].forEach((p,i)=>p.querySelector('.num').textContent='Page '+(i+1))}function addPage(t=1){let w=document.createElement('div');w.innerHTML=base(t);let p=w.firstElementChild;pages.appendChild(p);bind(p);setActive(p);p.scrollIntoView({behavior:'smooth'});auto()}function duplicatePage(){if(!active)return;let p=active.cloneNode(true);active.after(p);bind(p);setActive(p);auto()}function deletePage(){if(!active)return;if(pages.children.length===1)return alert('Keep at least one page.');let n=active.nextElementSibling||active.previousElementSibling;active.remove();setActive(n);auto()}function template(t){if(!active)return;let old=active,w=document.createElement('div');w.innerHTML=base(t);let p=w.firstElementChild;if(t===2){p.style.fontFamily='Georgia,serif';p.querySelector('.mast').style.textTransform='none'}if(t===4)p.style.background='#fafafa';if(t===5){p.querySelector('.hero').style.aspectRatio='4/5';p.querySelector('.two').style.display='none'}if(t===6){p.querySelector('.mast').textContent='THE DAILY EDIT';p.querySelector('.headline').textContent='Breaking stories and ideas that matter'}if(t===7){p.querySelector('.mast').textContent='BUSINESS';p.querySelector('.headline').textContent='Strategy • Markets • Innovation'}if(t===8)p.querySelector('.headline').textContent='PHOTO STORY';old.replaceWith(p);bind(p);setActive(p);auto();if(innerWidth<=900)side.classList.remove('open')}function controls(){return `<div class="controls"><button onclick="event.stopPropagation();move(this,-1)">↑</button><button onclick="event.stopPropagation();move(this,1)">↓</button><button onclick="event.stopPropagation();this.closest('.block').remove();auto()">Delete</button></div>`}function append(html){if(!active)return;let d=document.createElement('div');d.className='block';d.innerHTML=controls()+html;active.appendChild(d);auto();d.scrollIntoView({behavior:'smooth'});if(innerWidth<=900)side.classList.remove('open')}function addImage(){append(`<div class="photo" onclick="pick(this)">Tap to add image</div><p contenteditable="true">Image caption</p>`)}function addText(x){append(x==='h'?`<h2 contenteditable="true" style="font-size:32px">New section heading</h2>`:`<p class="text" contenteditable="true">Add your text here. Tap to edit.</p>`)}function addQuote(){append(`<blockquote class="quote" contenteditable="true">“Add an important quote or highlighted statement here.”</blockquote>`)}function addDivider(){append(`<div class="divider"></div>`)}function move(b,d){let x=b.closest('.block');if(d<0&&x.previousElementSibling)x.parentNode.insertBefore(x,x.previousElementSibling);if(d>0&&x.nextElementSibling)x.parentNode.insertBefore(x.nextElementSibling,x);auto()}function pick(el){imageTarget=el;imagePicker.click()}imagePicker.onchange=e=>{let f=e.target.files[0];if(!f||!imageTarget)return;let r=new FileReader;r.onload=()=>{imageTarget.innerHTML=`<img src="${r.result}" alt="Magazine image">`;auto()};r.readAsDataURL(f);e.target.value=''};function openGallery(){galleryModal.style.display='flex';if(innerWidth<=900)side.classList.remove('open')}function read(f){return new Promise(ok=>{let r=new FileReader;r.onload=()=>ok(r.result);r.readAsDataURL(f)})}async function insertGallery(){let fs=[...galleryFiles.files];if(!fs.length)return alert('Select images first.');let c=galleryCols.value,imgs='';for(let f of fs)imgs+=`<div class="photo"><img src="${await read(f)}" alt="Gallery image"></div>`;append(`<div class="gallery" style="grid-template-columns:repeat(${c},1fr)">${imgs}</div><p contenteditable="true">Gallery caption</p>`);galleryFiles.value='';galleryModal.style.display='none'}function color(c){accent=c;document.querySelectorAll('.page').forEach(p=>p.style.setProperty('--accent',c));auto()}function state(){let clone=pages.cloneNode(true);clone.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));return{title:magTitle.value,html:clone.innerHTML,accent}}function save(say=true){try{localStorage.setItem('magmaker-studio',JSON.stringify(state()));status.textContent='Saved';if(say)alert('Project saved in this browser.')}catch(e){alert('Could not save. Large images may exceed browser storage.')}}function auto(){status.textContent='Saving…';clearTimeout(timer);timer=setTimeout(()=>save(false),500)}function restore(){try{let s=JSON.parse(localStorage.getItem('magmaker-studio'));if(!s)return false;magTitle.value=s.title||'My Magazine';accent=s.accent||accent;pages.innerHTML=s.html;[...pages.children].forEach(bind);if(pages.firstElementChild)setActive(pages.firstElementChild);return true}catch(e){return false}}function newProject(){if(!confirm('Start a new magazine?'))return;localStorage.removeItem('magmaker-studio');pages.innerHTML='';magTitle.value='My Magazine';addPage(5)}magTitle.oninput=()=>{if(active&&active.querySelector('.mast'))active.querySelector('.mast').textContent=magTitle.value;auto()};pages.addEventListener('input',auto);window.addEventListener('resize',()=>{if(innerWidth>900)side.classList.remove('open')});if(!restore())addPage(5);</script></body></html>
