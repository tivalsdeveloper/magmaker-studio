12px;flex-wrap:wrap}.color{width:42px;height:42px;border:3px solid white;outline:1px solid #cbd5e1;border-radius:50%}.danger{background:#fee2e2!important;color:#991b1b}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:40;align-items:flex-end;justify-content:center}.modalbox{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}.modalbox input,.modalbox select{width:100%;padding:13px;border:1px solid #d8e0e8;border-radius:10px;margin:8px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.row .btn{width:100%;padding:10px}.authnote{font-size:12px;color:#64748b;line-height:1.45}.autherr{font-size:12px;color:#b91c1c;min-height:18px}.cloudlist{display:grid;gap:8px;margin-top:12px}.clouditem{border:1px solid #dce4ec;border-radius:12px;padding:12px;background:#f8fafc}.clouditem strong{display:block;margin-bottom:4px}.clouditem small{color:#64748b}.clouditem .row{margin-top:8px}.pill{display:inline-block;background:#e0f2fe;color:#0369a1;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.desktop-actions{display:none}@media(min-width:700px){.page{min-height:990px;padding:45px}.two{grid-template-columns:2fr 1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))!important}.mast{font-size:48px}.headline{font-size:34px}.text{font-size:16px}.canvas{padding:24px 18px 90px}}@media(min-width:1000px){.app{display:flex}.desktop-side{display:block;width:270px;flex:0 0 270px;background:#172536;color:#fff;padding:18px;overflow:auto;height:100dvh;position:sticky;top:0}.brand{font-size:22px;font-weight:800;margin-bottom:20px}.brand small{display:block;font-size:11px;color:#9fb0c2;margin-top:4px}.sec{margin:20px 0}.sec h3{font-size:11px;letter-spacing:1.2px;color:#9fb0c2}.tool,.tpl{width:100%;border:0;border-radius:8px;padding:11px;background:#26394d;color:#fff;margin:4px 0;text-align:left}.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.main{flex:1;min-width:0}.top{grid-template-columns:1fr auto;padding:10px 18px}.top>.iconbtn,.top>.savebtn{display:none}.title{max-width:520px}.desktop-actions{display:flex;gap:8px}.desktop-actions .btn{padding:10px 13px}.statusbar{text-align:left;padding-left:18px}.canvas{padding:35px 24px 50px;gap:38px}.page{width:794px;min-height:1123px;padding:55px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))!important}.bottomnav{display:none}.sheetback{display:none!important}.modal{align-items:center;padding:16px}.modalbox{width:min(92%,520px);border-radius:16px}}@media print{.desktop-side,.top,.statusbar,.bottomnav,.controls,.num,.sheetback{display:none!important}.app,.main,.canvas{display:block;height:auto;padding:0;background:#fff}.page{box-shadow:none;outline:0!important;width:210mm;min-height:297mm;page-break-after:always;margin:0;padding:15mm}}

<aside class="desktop-side"><div class="brand">MagMaker Studio<small>Powered by tivalsdeveloper</small></div><div class="sec"><h3>PAGES</h3><button class="tool" onclick="addPage()">＋ Add page</button><button class="tool" onclick="duplicatePage()">⧉ Duplicate page</button><button class="tool" onclick="deletePage()">⌫ Delete page</button></div><div class="sec"><h3>TEMPLATES</h3><div class="dgrid"><button class="tpl" onclick="template(1)">Modern</button><button class="tpl" onclick="template(2)">Classic</button><button class="tpl" onclick="template(3)">Dark</button><button class="tpl" onclick="template(4)">Minimal</button><button class="tpl" onclick="template(5)">Cover</button><button class="tpl" onclick="template(6)">News</button><button class="tpl" onclick="template(7)">Business</button><button class="tpl" onclick="template(8)">Photo Story</button></div></div><div class="sec"><h3>ADD CONTENT</h3><button class="tool" onclick="addImage()">＋ Image</button><button class="tool" onclick="openGallery()">▦ Image gallery</button><button class="tool" onclick="addText('p')">Aa Text</button><button class="tool" onclick="addText('h')">H Heading</button><button class="tool" onclick="addQuote()">❝ Quote</button><button class="tool" onclick="addDivider()">━ Divider</button></div><div class="sec"><h3>CLOUD</h3><button class="tool" onclick="openAccount()">☁ Account & Cloud</button></div><div class="sec"><h3>THEME</h3><div class="colors"><i class="color" style="background:#2384d8" onclick="color('#2384d8')"></i><i class="color" style="background:#e11d48" onclick="color('#e11d48')"></i><i class="color" style="background:#16a34a" onclick="color('#16a34a')"></i><i class="color" style="background:#7c3aed" onclick="color('#7c3aed')"></i><i class="color" style="background:#f59e0b" onclick="color('#f59e0b')"></i><i class="color" style="background:#111827" onclick="color('#111827')"></i></div></div></aside>

<script>
const WOW_URL='https://tivals-alerts-2d1a6175.wowsqlconnect.com';
const WOW_ANON='wowsql_anon_kHSbCA3AdgIo0paRml4jBmR7VauWAg6tiux0f9cbxcM';
const pages=document.getElementById('pages'),magTitle=document.getElementById('magTitle'),statusEl=document.getElementById('status'),galleryModal=document.getElementById('galleryModal'),accountModal=document.getElementById('accountModal'),accountContent=document.getElementById('accountContent'),imagePicker=document.getElementById('imagePicker'),sheetback=document.getElementById('sheetback'),sheetcontent=document.getElementById('sheetcontent');
let active=null,imageTarget=null,accent='#2384d8',timer,currentCloudKey=localStorage.getItem('magmaker-cloud-key')||null;
let session=JSON.parse(localStorage.getItem('magmaker-session')||'null');
function base(t=1){let style=t===3?'background:#111827;color:white;':'';return `<div class="page" style="--accent:${accent};${style}"><div class="num"></div><div class="mast" contenteditable="true">${magTitle.value||'MY MAGAZINE'}</div><div class="kicker" contenteditable="true">ISSUE 01 • STORIES • IDEAS • PEOPLE</div><div class="hero" onclick="pick(this)">Tap to add a cover image</div><div class="headline" contenteditable="true">A powerful story starts with a great headline</div><div class="two"><div class="text" contenteditable="true">Tap here and start writing your article. MagMaker works on desktop, tablet and mobile devices.</div><div class="card"><h2 contenteditable="true">Inside</h2><p contenteditable="true">Add highlights, notes or important information here.</p></div></div></div>`}
function bind(p){p.onclick=()=>setActive(p)}function setActive(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));active=p;p.classList.add('active');number()}function number(){[...pages.children].forEach((p,i)=>p.querySelector('.num').textContent='Page '+(i+1))}
function addPage(t=1){let w=document.createElement('div');w.innerHTML=base(t);let p=w.firstElementChild;pages.appendChild(p);bind(p);setActive(p);p.scrollIntoView({behavior:'smooth',block:'center'});auto();closeSheet()}function duplicatePage(){if(!active)return;let p=active.cloneNode(true);active.after(p);bind(p);setActive(p);auto();closeSheet()}function deletePage(){if(!active)return;if(pages.children.length===1)return alert('Keep at least one page.');let n=active.nextElementSibling||active.previousElementSibling;active.remove();setActive(n);auto();closeSheet()}
function template(t){if(!active)return;let old=active,w=document.createElement('div');w.innerHTML=base(t);let p=w.firstElementChild;if(t===2){p.style.fontFamily='Georgia,serif';p.querySelector('.mast').style.textTransform='none'}if(t===4)p.style.background='#fafafa';if(t===5){p.querySelector('.hero').style.aspectRatio='4/5';p.querySelector('.two').style.display='none'}if(t===6){p.querySelector('.mast').textContent='THE DAILY EDIT';p.querySelector('.headline').textContent='Breaking stories and ideas that matter'}if(t===7){p.querySelector('.mast').textContent='BUSINESS';p.querySelector('.headline').textContent='Strategy • Markets • Innovation'}if(t===8)p.querySelector('.headline').textContent='PHOTO STORY';old.replaceWith(p);bind(p);setActive(p);auto();closeSheet()}
function controls(){return `<div class="controls"><button onclick="event.stopPropagation();move(this,-1)">↑</button><button onclick="event.stopPropagation();move(this,1)">↓</button><button onclick="event.stopPropagation();this.closest('.block').remove();auto()">Delete</button></div>`}function append(html){if(!active)return;let d=document.createElement('div');d.className='block';d.innerHTML=controls()+html;active.appendChild(d);auto();d.scrollIntoView({behavior:'smooth',block:'center'});closeSheet()}function addImage(){append(`<div class="photo" onclick="pick(this)">Tap to add image</div><p contenteditable="true">Image caption</p>`)}function addText(x){append(x==='h'?`<h2 contenteditable="true" style="font-size:32px">New section heading</h2>`:`<p class="text" contenteditable="true">Add your text here. Tap to edit.</p>`)}function addQuote(){append(`<blockquote class="quote" contenteditable="true">“Add an important quote or highlighted statement here.”</blockquote>`)}function addDivider(){append(`<div class="divider"></div>`)}function move(b,d){let x=b.closest('.block');if(d<0&&x.previousElementSibling)x.parentNode.insertBefore(x,x.previousElementSibling);if(d>0&&x.nextElementSibling)x.parentNode.insertBefore(x.nextElementSibling,x);auto()}
function pick(el){imageTarget=el;imagePicker.click()}imagePicker.onchange=e=>{let f=e.target.files[0];if(!f||!imageTarget)return;let r=new FileReader;r.onload=()=>{imageTarget.innerHTML=`<img src="${r.result}" alt="Magazine image">`;auto()};r.readAsDataURL(f);e.target.value=''};function openGallery(){galleryModal.style.display='flex';closeSheet()}function read(f){return new Promise(ok=>{let r=new FileReader;r.onload=()=>ok(r.result);r.readAsDataURL(f)})}async function insertGallery(){let fs=[...document.getElementById('galleryFiles').files];if(!fs.length)return alert('Select images first.');let c=document.getElementById('galleryCols').value,imgs='';for(let f of fs)imgs+=`<div class="photo"><img src="${await read(f)}" alt="Gallery image"></div>`;append(`<div class="gallery" style="grid-template-columns:repeat(${c},1fr)">${imgs}</div><p contenteditable="true">Gallery caption</p>`);document.getElementById('galleryFiles').value='';galleryModal.style.display='none'}function color(c){accent=c;document.querySelectorAll('.page').forEach(p=>p.style.setProperty('--accent',c));auto();closeSheet()}
function state(){let clone=pages.cloneNode(true);clone.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));return{title:magTitle.value,html:clone.innerHTML,accent}}function loadState(s){if(!s)return;magTitle.value=s.title||'My Magazine';accent=s.accent||'#2384d8';pages.innerHTML=s.html||'';[...pages.children].forEach(bind);if(pages.firstElementChild)setActive(pages.firstElementChild);if(!pages.children.length)addPage(5)}
function saveLocal(say=false){try{localStorage.setItem('magmaker-studio',JSON.stringify(state()));statusEl.textContent=session?'Saved locally • Cloud available':'Saved locally';if(say)alert('Saved on this device.')}catch(e){alert('Could not save locally. Large images may exceed browser storage.')}}function auto(){statusEl.textContent='Saving…';clearTimeout(timer);timer=setTimeout(()=>saveLocal(false),500)}function restore(){try{let s=JSON.parse(localStorage.getItem('magmaker-studio'));if(!s)return false;loadState(s);return true}catch(e){return false}}
function authHeaders(){return {'apikey':WOW_ANON,'Content-Type':'application/json'}}function dbHeaders(){return {'apikey':WOW_ANON,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'}}function friendlyError(e){let m=String(e?.message||e||'Unknown error');if(/404|disabled|not found/i.test(m))return 'WoWSQL Authentication is not enabled for this project yet.';return m}
async function api(path,opt={}){let r=await fetch(WOW_URL+path,opt),text=await r.text(),data;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok){let msg=(data&&typeof data==='object'&&(data.message||data.error||data.detail))||text||('HTTP '+r.status);throw new Error(msg+' ['+r.status+']')}return data}
function openAccount(){closeSheet();accountModal.style.display='flex';renderAccount()}function closeAccount(){accountModal.style.display='none'}
function renderAccount(){if(!session){accountContent.innerHTML=`<h2>MagMaker Cloud</h2><p class="authnote">Sign in to save magazines online and open them on another device.</p><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password" minlength="8"><div id="authErr" class="autherr"></div><div class="row"><button class="btn" onclick="signUp()">Create account</button><button class="btn primary" onclick="signIn()">Sign in</button></div><button class="btn" style="width:100%;margin-top:8px" onclick="closeAccount()">Close</button>`;return}let email=session.user?.email||'Signed in';accountContent.innerHTML=`<h2>MagMaker Cloud</h2><p><span class="pill">${escapeHtml(email)}</span></p><div class="row"><button class="btn primary" onclick="saveCloud()">☁ Save to cloud</button><button class="btn" onclick="listCloudProjects()">My projects</button></div><div class="row"><button class="btn danger" onclick="signOut()">Sign out</button><button class="btn" onclick="closeAccount()">Close</button></div><div id="cloudArea"></div>`}
async function signUp(){let email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,err=document.getElementById('authErr');err.textContent='Creating account…';try{let d=await api('/auth/v1/signup',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password})});let token=d?.access_token||d?.session?.access_token||d?.session?.accessToken;if(token){session={access_token:token,refresh_token:d?.refresh_token||d?.session?.refresh_token,user:d.user||d.session?.user};localStorage.setItem('magmaker-session',JSON.stringify(session));renderAccount();return}err.textContent='Account created. Check your email if verification is required, then sign in.'}catch(e){err.textContent=friendlyError(e)}}
async function signIn(){let email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,err=document.getElementById('authErr');err.textContent='Signing in…';try{let d=await api('/auth/v1/login',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password})});let token=d?.access_token||d?.session?.access_token||d?.session?.accessToken;if(!token)throw new Error('No access token returned');session={access_token:token,refresh_token:d?.refresh_token||d?.session?.refresh_token,user:d.user||d.session?.user};localStorage.setItem('magmaker-session',JSON.stringify(session));statusEl.textContent='Signed in • Cloud ready';renderAccount()}catch(e){err.textContent=friendlyError(e)}}
function signOut(){session=null;currentCloudKey=null;localStorage.removeItem('magmaker-session');localStorage.removeItem('magmaker-cloud-key');statusEl.textContent='Signed out • Local save only';renderAccount()}
async function saveCloud(silent=false){saveLocal(false);if(!session){if(!silent)openAccount();return false}statusEl.textContent='Saving to cloud…';try{let s=state(),body={title:s.title,project_data:s,updated_at:new Date().toISOString()};if(currentCloudKey){await api('/rest/v1/magmaker_projects?project_key=eq.'+encodeURIComponent(currentCloudKey),{method:'PATCH',headers:{...dbHeaders(),'Prefer':'return=representation'},body:JSON.stringify(body)})}else{currentCloudKey=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));body.project_key=currentCloudKey;body.user_id=session.user?.id;if(!body.user_id)throw new Error('User ID missing from session');await api('/rest/v1/magmaker_projects',{method:'POST',headers:{...dbHeaders(),'Prefer':'return=representation'},body:JSON.stringify(body)});localStorage.setItem('magmaker-cloud-key',currentCloudKey)}statusEl.textContent='Saved to cloud ✓';if(!silent)alert('Magazine saved to your cloud account.');return true}catch(e){statusEl.textContent='Cloud save failed';if(!silent)alert('Cloud save failed: '+friendlyError(e));return false}}
async function listCloudProjects(){let area=document.getElementById('cloudArea');area.innerHTML='<p class="authnote">Loading projects…</p>';try{let d=await api('/rest/v1/magmaker_projects?select=project_key,title,updated_at&order=updated_at.desc',{headers:dbHeaders()});if(!Array.isArray(d)||!d.length){area.innerHTML='<p class="authnote">No cloud projects yet. Save this magazine to create one.</p>';return}area.innerHTML='<div class="cloudlist">'+d.map(p=>`<div class="clouditem"><strong>${escapeHtml(p.title||'Untitled')}</strong><small>${new Date(p.updated_at).toLocaleString()}</small><div class="row"><button class="btn primary" onclick="openCloud('${p.project_key}')">Open</button><button class="btn danger" onclick="deleteCloud('${p.project_key}')">Delete</button></div></div>`).join('')+'</div>'}catch(e){area.innerHTML='<p class="autherr">'+escapeHtml(friendlyError(e))+'</p>'}}
async function openCloud(key){try{let d=await api('/rest/v1/magmaker_projects?project_key=eq.'+encodeURIComponent(key)+'&select=project_key,title,project_data',{headers:dbHeaders()});if(!Array.isArray(d)||!d[0])throw new Error('Project not found');currentCloudKey=d[0].project_key;localStorage.setItem('magmaker-cloud-key',currentCloudKey);loadState(d[0].project_data);saveLocal(false);statusEl.textContent='Loaded from cloud';closeAccount()}catch(e){alert('Could not open project: '+friendlyError(e))}}
async function deleteCloud(key){if(!confirm('Delete this cloud project?'))return;try{await api('/rest/v1/magmaker_projects?project_key=eq.'+encodeURIComponent(key),{method:'DELETE',headers:dbHeaders()});if(currentCloudKey===key){currentCloudKey=null;localStorage.removeItem('magmaker-cloud-key')}listCloudProjects()}catch(e){alert('Could not delete: '+friendlyError(e))}}

function newProject(){if(!confirm('Start a new magazine?'))return;localStorage.removeItem('magmaker-studio');localStorage.removeItem('magmaker-cloud-key');currentCloudKey=null;pages.innerHTML='';magTitle.value='My Magazine';addPage(5)}
